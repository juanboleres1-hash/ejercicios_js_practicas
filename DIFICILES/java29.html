<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Resumen</title>
    <link rel="stylesheet" href="java29.css">
</head>
<body>

    <div class="card">
        <h2>Formulario de Contacto</h2>

        <form id="contactForm">
            <div class="campo">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="Usuario@correo.com" required>
            </div>

            <div class="campo">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" placeholder="Motivo del mensaje" required>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí" required></textarea>
            </div>

            <button type="submit">Enviar Mensaje</button>
        </form>

        <div id="resumenContainer" class="resumen-oculto">
            <h3>Mensaje Enviado con Éxito</h3>
            <p class="subtitulo">Aquí tienes el resumen de tus datos:</p>
            
            <div class="resumen-caja">
                <p><strong>Nombre:</strong> <span id="resNombre"></span></p>
                <p><strong>Correo:</strong> <span id="resCorreo"></span></p>
                <p><strong>Asunto:</strong> <span id="resAsunto"></span></p>
                <p><strong>Mensaje:</strong> <span id="resMensaje"></span></p>
            </div>

            <button id="btnVolver" class="btn-secundario">Enviar otro mensaje</button>
        </div>
    </div>

    <script src="java29.js"></script>
</body>
</html>
