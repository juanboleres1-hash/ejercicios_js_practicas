<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro con Validaciones</title>
    <link rel="stylesheet" href="java22.css">
</head>
<body>

    <div class="card">
        <h2>Crear Cuenta Nueva</h2>

        <form id="registroForm">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Nombre completo">
                <span id="errorNombre" class="error-text"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico</label>
                <input type="text" id="correo" placeholder="Usuario@correo.com">
                <span id="errorCorreo" class="error-text"></span>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="caracteres y un números">
                <span id="errorPassword" class="error-text"></span>
            </div>

            <button type="submit">Registrarse</button>
            <p id="exitoMensaje" class="success-text"></p>
        </form>
    </div>

    <script src="java22.js"></script>
</body>
</html>
