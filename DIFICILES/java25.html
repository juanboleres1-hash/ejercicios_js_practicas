<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acordeón</title>
    <link rel="stylesheet" href="java25.css">
</head>
<body>

    <div class="faq-container">
        <h2>Preguntas Frecuentes</h2>


        <div class="faq-item">
            <button class="faq-pregunta">¿Cuando acabo practicas?</button>
            <div class="faq-respuesta">
                <p>Termino el Jueves 8 de Octubre.</p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-pregunta">¿Cuando empece practicas?</button>
            <div class="faq-respuesta">
                <p>Empece el dia Martes 1 de Septiembre.</p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-pregunta">¿Cuando tuve que haber empezado?</button>
            <div class="faq-respuesta">
                <p>Pues los del año pasado empezaron a mediados de Agosto .</p>
            </div>
        </div>

        <div class="faq-item">
            <button class="faq-pregunta">¿Porque no empece antes?</button>
            <div class="faq-respuesta">
                <p>Porque los del Mineduc decidieron mandarnos hasta el 1 de Septiembre segun mi colegio.</p>
            </div>
        </div>
    </div>

    <script src="java25.js"></script>
</body>
</html>
