<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación</title>
    <link rel="stylesheet" href="java24.css">
</head>
<body>

    <div class="card">
        <h2>Registro con Validación</h2>

        <form id="valForm">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="campo">
                <label for="correo">Correo Electrónico</label>
                <input type="text" id="correo" placeholder="Usuario@correo.com">
            </div>
     <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="caracteres y un número">
            </div>

            <button type="submit" id="btnSubmit" disabled>Enviar Datos</button>
        </form>
    </div>

    <script src="java24.js"></script>
</body>
</html>
