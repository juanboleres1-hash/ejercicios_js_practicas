<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Multipasos</title>
    <link rel="stylesheet" href="java27.css">
</head>
<body>

    <div class="card">
        <h2>Registro de Usuario</h2>

        <form id="multiStepForm">
            <div class="step active" id="step-1">
                <h3>Paso 1: Datos Personales</h3>
                
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre completo">
                    <span id="errorNombre" class="error"></span>
                </div>

                <div class="campo">
                    <label for="correo">Correo Electrónico</label>
                    <input type="text" id="correo" placeholder="Usuario@correo.com">
                    <span id="errorCorreo" class="error"></span>
                </div>

                <button type="button" id="btnNext1">Siguiente</button>
            </div>

            <div class="step" id="step-2">
                <h3>Paso 2: Ubicación</h3>
                
                <div class="campo">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" placeholder="Tu ciudad">
                    <span id="errorCiudad" class="error"></span>
                </div>

                <div class="campo">
                    <label for="pais">País</label>
                    <input type="text" id="pais" placeholder="Tu país">
                    <span id="errorPais" class="error"></span>
                </div>

                <div class="botones-flex">
                    <button type="button" id="btnPrev2" class="btn-secundario">Atrás</button>
                    <button type="button" id="btnNext2">Siguiente</button>
                </div>
            </div>

            <div class="step" id="step-3">
                <h3>Paso 3: Confirmación</h3>
                <p class="exito-texto">¡Ya casi terminamos! Revisa que todo esté correcto y confirma tu registro.</p>

                <div class="botones-flex">
                    <button type="button" id="btnPrev3" class="btn-secundario">Atrás</button>
                    <button type="submit" id="btnSubmit">Confirmar y Enviar</button>
                </div>
            </div>
        </form>

        <div id="mensajeFinal" class="mensaje-final"></div>
    </div>

    <script src="java27.js"></script>
</body>
</html>
