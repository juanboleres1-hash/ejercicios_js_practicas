<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Completa</title>
    <link rel="stylesheet" href="java34.css">
</head>
<body>

    <div class="calculadora">
        <div id="pantalla" class="pantalla">0</div>

        <div class="botones">
            <button class="btn operacion special" data-valor="C">C</button>
            <button class="btn operacion" data-valor="/">÷</button>
            <button class="btn operacion" data-valor="*">×</button>
            <button class="btn operacion" data-valor="-">-</button>

            <button class="btn numero" data-valor="7">7</button>
            <button class="btn numero" data-valor="8">8</button>
            <button class="btn numero" data-valor="9">9</button>
            <button class="btn operacion" data-valor="+">+</button>

            <button class="btn numero" data-valor="4">4</button>
            <button class="btn numero" data-valor="5">5</button>
            <button class="btn numero" data-valor="6">6</button>
            <button class="btn numero igual" data-valor="=">=</button>

            <button class="btn numero" data-valor="1">1</button>
            <button class="btn numero" data-valor="2">2</button>
            <button class="btn numero" data-valor="3">3</button>

            <button class="btn numero cero" data-valor="0">0</button>
            <button class="btn numero" data-valor=".">.</button>
        </div>
    </div>

    <script src="java34.js"></script>
</body>
</html>
