<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro con Fortaleza de Contraseña</title>
    <link rel="stylesheet" href="java35.css">
</head>
<body>

    <div class="card">
        <h2>Crear Cuenta</h2>

        <form id="registroForm">
            <div class="campo">
                <label for="password">Contraseña</label>
                
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                    <button type="button" id="btnToggle">👁️</button>
                </div>

                <div class="strength-meter">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <span id="strengthText" class="strength-text">Introduce una contraseña</span>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>

    <script src="java35.js"></script>
</body>
</html>
