<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validador Reutilizable</title>
    <link rel="stylesheet" href="java33.css">
</head>
<body>

    <div class="card">
        <h2>Registro Genérico</h2>

        <form id="myForm" novalidate>
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" data-rules="required">
                <span class="error" data-error-for="nombre"></span>
            </div>

            <div class="campo">
                <label for="correo">Correo Electrónico</label>
                <input type="text" id="correo" name="correo" data-rules="required|email">
                <span class="error" data-error-for="correo"></span>
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" data-rules="required|min:6">
                <span class="error" data-error-for="password"></span>
            </div>

            <button type="submit">Enviar Formulario</button>
            <p id="exitoMensaje" class="success"></p>
        </form>
    </div>

    <script src="java33.js"></script>
</body>
</html>
